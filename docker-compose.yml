services:
  db:
    image: postgres:16
    container_name: pizza-cheese-db
    ports:
      # Host 5433 avoids clashing with a local Postgres already on 5432
      - "5433:5432"
    environment:
      POSTGRES_DB: pizza_cheese
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pizza_cheese"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
