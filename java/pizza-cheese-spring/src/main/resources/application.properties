spring.application.name=todo
server.port=8080

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Load local secrets from repo-root .env (JWT, Cloudinary, Supabase DB_*, ...)
spring.config.import=optional:file:.env[.properties],optional:file:../../.env[.properties]

# Database — pick ONE block (comment the other), then restart Spring.
# A) Supabase (daily) — URL/user/pass from .env
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
# B) Docker local (seed / load-test) — run: docker compose up -d
# spring.datasource.url=jdbc:postgresql://localhost:5433/pizza_cheese
# spring.datasource.username=postgres
# spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
# Fail fast when pool is exhausted (common after debug-pause inside @Transactional)
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.leak-detection-threshold=30000

# Flyway
spring.flyway.baseline-on-migrate=true

# JWT (generate with: openssl rand -base64 32)
app.jwt.base64-secret=${JWT_BASE64_SECRET:}
app.jwt.access-token-validity-in-seconds=3600
app.jwt.refresh-token-validity-in-seconds=604800

# User
app.user.default-avatar-url=https://static.vecteezy.com/system/resources/previews/067/213/562/non_2x/simple-male-avatar-icon-flat-design-profile-picture-free-vector.jpg

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.folder.avatar=pizza-store/avatar
cloudinary.folder.pizza=pizza-store/pizza
cloudinary.folder.category=pizza-store/category
cloudinary.folder.combo=pizza-store/combo

# VNPay (secrets from .env; URLs per profile in application-{profile}.properties)
app.vnpay.tmn-code=${VNPAY_TMN_CODE:}
app.vnpay.hash-secret=${VNPAY_HASH_SECRET:}

# Cache (menu catalog)
app.cache.redis-enabled=${REDIS_ENABLED:false}
app.cache.menu-ttl-seconds=${CACHE_MENU_TTL_SECONDS:600}

# Redis (used when app.cache.redis-enabled=true)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
